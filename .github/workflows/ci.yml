# Builds and tests HAFB on every push and pull request. A version tag (v0.9.1) also sends the
# installers to SignPath for signing, once the SignPath project is set up, and drafts a GitHub
# release with them. Code signing policy: README.md.
#
# Third-party actions are pinned to a full commit (each release at least two weeks old when
# picked, as the pnpm supply-chain gate does for packages).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: Send this build to SignPath for signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: write # draft releases for version tags
      actions: read # SignPath reads this job and its artifact
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from package.json)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # SQLCipher's OpenSSL is compiled from source and its build scripts need Perl (ADR 0010).
      - name: Strawberry Perl
        run: |
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { choco install strawberryperl --no-progress -y }
          "C:\Strawberry\perl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rust
      - run: pnpm build

      - name: License notices are current
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.txt

      - name: Collect the installers
        id: collect
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version (pnpm version:set)"
          }
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "$bundle/msi/HAFB_${version}_x64_en-US.msi", "$bundle/portable/HAFB_${version}_x64_portable.zip" out
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Upload for signing
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned
          path: out/
          if-no-files-found: error

      # Runs once the SignPath project exists (repository variables below); every request waits
      # for an approver in SignPath. Artifact configuration: .github/signpath/artifact-configuration.xml
      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.sign)
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 86400
          output-artifact-directory: signed

      - name: Checksums
        run: |
          if (Test-Path signed) { Remove-Item out -Recurse; Move-Item signed out }
          $version = '${{ steps.collect.outputs.version }}'
          Get-ChildItem out -File -Include *.msi, *.zip -Recurse | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content -Encoding ascii "out/SHA256SUMS_${version}_x64.txt"
          Get-Content "out/SHA256SUMS_${version}_x64.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HAFB-${{ steps.collect.outputs.version }}-x64
          path: out/
          if-no-files-found: error

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out -File).FullName --draft --verify-tag --title "HAFB ${{ steps.collect.outputs.version }}" --notes "See CHANGELOG.md for what's new, and docs/install.md for installing and checking a download."
