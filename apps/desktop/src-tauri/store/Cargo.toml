[package]
name = "hafb-store"
version = "0.9.1"
description = "HAFB plan files: migrations, generic row load/apply, backups (ADR 0002). No Tauri, no network."
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "hafb_store"

# Dev tool used by `pnpm import:ynab` and tests. It lives in this crate, not the app crate, so the
# Tauri bundler never ships it.
[[bin]]
name = "hafb-store"
path = "src/bin/hafb-store.rs"

[dependencies]
# Same pins and features as the app crate (SQLCipher for plan passwords, S8.3b, ADR 0010).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
