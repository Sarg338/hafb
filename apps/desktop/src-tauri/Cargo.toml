[package]
name = "hafb"
version = "0.9.0"
description = "HAFB - Here's A Free Budget"
license = "MIT"
edition = "2024"
rust-version = "1.85"
publish = false
# The app binary is the default; the hafb-store CLI lives in the `store` crate so it is never bundled.
default-run = "hafb"

[workspace]
members = ["store"]

[lib]
name = "hafb_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Default features only: no updater, no HTTP client, nothing that talks to the network.
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
# Compiles SQLCipher (SQLite plus page encryption, for plan passwords: S8.3b, ADR 0010) into the
# binary with OpenSSL's crypto library built from source: a known version, no system DLL. A plain
# plan is still a plain SQLite file. OpenSSL is used for ciphers only (SQLCipher never opens a
# socket). Building needs Strawberry Perl (README).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
# Custom title bar that keeps Windows 11 Snap Layouts. Source audited 2026-10-08 (see ADR 0001); pinned exactly.
tauri-plugin-frame = "=1.1.8"
# Plan files (ADR 0002): migrations, generic load/apply, backups. Our own crate; no Tauri inside.
hafb-store = { path = "store" }
# Native open/save dialogs (Windows IFileDialog over COM). Audited 2026-10-08 at 0.17.2: on Windows it
# depends only on log, raw-window-handle 0.6 and windows-sys 0.61 (both already in the tree); no
# network, process or file APIs. Default features (xdg-portal, wayland) are Linux-only and disabled.
rfd = { version = "=0.17.2", default-features = false }
# Optional bank sync through SimpleFIN Bridge (S8.6, ADR 0006): the ONLY crate allowed to make
# network calls, and only from src/bank_sync.rs, to the host the user's SimpleFIN token names.
# ureq is a small blocking client with no telemetry, no background threads and no update checks.
# Features: rustls with ring and the bundled Mozilla roots (webpki-roots), so certificate checks
# never make Windows fetch revocation lists from other hosts. No gzip, cookies, proxy or JSON.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# Already in the tree (Tauri). Setup tokens are base64; Basic auth for the access URL.
base64 = "0.22.1"
# Already in the tree (hafb-store). SimpleFIN's answers are passed to the webview as JSON.
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
# Already in the tree via tauri-plugin-frame; used directly for the process start time, COM
# (webview_env) and Credential Manager (credentials).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Com",
  # Credential Manager, for "Remember on this PC" with plan passwords (S8.3b, src/credentials.rs).
  "Win32_Security_Credentials",
] }
# Already in the tree via Tauri/wry, pinned to the same versions so the types match. Used to create
# the WebView2 environment with Microsoft's privacy options (S8.3, src/webview_env.rs). Bindings
# only: no network code of their own.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
